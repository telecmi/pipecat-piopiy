[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-piopiy"
version = "0.2.0"
description = "Piopiy (TeleCMI) telephony for Pipecat voice agents: take calls, transfer them, hang up"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TeleCMI", email = "support@telecmi.com" }]
keywords = ["pipecat", "voice", "telephony", "sip", "piopiy", "telecmi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "pipecat-ai[livekit]>=1.8.0,<2",
    "piopiy-agent>=1.1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
example = ["pipecat-ai[livekit,deepgram,openai,silero]>=1.8.0,<2", "python-dotenv>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Homepage = "https://piopiy.com"
Repository = "https://github.com/telecmi/pipecat-piopiy"
Documentation = "https://github.com/telecmi/pipecat-piopiy#readme"

[tool.setuptools.packages.find]
include = ["pipecat_piopiy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
